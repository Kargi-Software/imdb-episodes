name: Build IMDb Episodes

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

concurrency:
  group: build-imdb-episodes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show disk information
        shell: bash
        run: |
          set -euo pipefail
          df -h

      - name: Download IMDb datasets
        shell: bash
        # فقط title.basics و title.episode لازمه؛ چون دیگه فقط اسم اپیزود
        # می‌خوایم (نه ژانر/کارگردان/نویسنده/بازیگر)، دانلود
        # title.crew / title.principals / name.basics حذف شد - هم سریع‌تر
        # میشه هم دیسک کمتری لازم داره.
        run: |
          set -euo pipefail

          mkdir -p datasets

          download() {
            local name="$1"

            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 10 \
              --output "datasets/${name}.gz" \
              "https://datasets.imdbws.com/${name}.gz"
          }

          download "title.basics.tsv"
          download "title.episode.tsv"

          echo "Downloaded files:"
          du -h datasets/*

      - name: Build episode shards
        shell: bash
        # اسکریپت به‌صورت فایل جدا (build_episodes.py) توی ریشه‌ی همین ریپو
        # نگه‌داری میشه، نه به‌صورت heredoc توی yaml.
        run: |
          set -euo pipefail
          python3 build_episodes.py

      - name: Show output information
        shell: bash
        run: |
          set -euo pipefail

          echo "Version information:"
          cat out/version.json
          echo

          echo "Output size:"
          du -sh out

          echo "Number of shard files:"
          find out/episodes -type f -name '*.json' | wc -l

          echo "Example shard files:"
          find out/episodes -type f -name '*.json' | head -n 10 || true

          echo "Disk information:"
          df -h

      - name: Remove temporary build files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf datasets
          rm -f episodes-build.sqlite3
          rm -f episodes-build.sqlite3-shm
          rm -f episodes-build.sqlite3-wal
          rm -f episodes-build.sqlite3-journal

          df -h

      - name: Deploy episodes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "IMDb Episodes Bot"
          git config user.email "bot@users.noreply.github.com"

          git checkout --orphan gh-pages

          git rm -rf . || true

          mv out/episodes ./episodes
          mv out/version.json ./version.json

          rm -rf out

          touch .nojekyll

          git add episodes version.json .nojekyll

          git commit \
            -m "Update IMDb episode shards"

          git push \
            --force \
            origin gh-pages
