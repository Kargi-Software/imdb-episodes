name: Build IMDb Episodes

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

concurrency:
  group: build-imdb-episodes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show disk information
        shell: bash
        run: |
          set -euo pipefail
          df -h

      - name: Download IMDb datasets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p datasets

          download() {
            local name="$1"

            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 10 \
              --output "datasets/${name}.gz" \
              "https://datasets.imdbws.com/${name}.gz"
          }

          download "title.basics.tsv"
          download "title.episode.tsv"
          download "title.crew.tsv"
          download "title.principals.tsv"
          download "name.basics.tsv"

          echo "Downloaded files:"
          du -h datasets/*

      - name: Build episode shards
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import datetime
          import gzip
          import json
          import shutil
          import sqlite3
          from pathlib import Path
          
          
          DATASET_DIRECTORY = Path("datasets")
          OUTPUT_DIRECTORY = Path("out")
          EPISODE_DIRECTORY = OUTPUT_DIRECTORY / "episodes"
          DATABASE_PATH = Path("episodes-build.sqlite3")
          
          CAST_LIMIT = 3
          DATABASE_BATCH_SIZE = 25_000
          NAME_QUERY_BATCH_SIZE = 800
          
          
          def clean_text(value):
              if value in (None, "", r"\N"):
                  return None
          
              return value
          
          
          def clean_int(value):
              value = clean_text(value)
          
              if value is None:
                  return None
          
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return None
          
          
          def parse_genres(value):
              value = clean_text(value)
          
              if value is None:
                  return []
          
              return [
                  genre
                  for genre in value.split(",")
                  if genre and genre != r"\N"
              ]
          
          
          def parse_ids(value):
              value = clean_text(value)
          
              if value is None:
                  return []
          
              return [
                  person_id
                  for person_id in value.split(",")
                  if person_id and person_id != r"\N"
              ]
          
          
          def encode_json(value):
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  separators=(",", ":")
              )
          
          
          def open_dataset(filename):
              handle = gzip.open(
                  DATASET_DIRECTORY / filename,
                  mode="rt",
                  encoding="utf-8",
                  newline=""
              )
          
              reader = csv.DictReader(
                  handle,
                  delimiter="\t"
              )
          
              return handle, reader
          
          
          def reset_build():
              if OUTPUT_DIRECTORY.exists():
                  shutil.rmtree(OUTPUT_DIRECTORY)
          
              OUTPUT_DIRECTORY.mkdir(
                  parents=True,
                  exist_ok=True
              )
          
              EPISODE_DIRECTORY.mkdir(
                  parents=True,
                  exist_ok=True
              )
          
              if DATABASE_PATH.exists():
                  DATABASE_PATH.unlink()
          
          
          def create_database():
              connection = sqlite3.connect(
                  DATABASE_PATH,
                  timeout=120
              )
          
              connection.execute(
                  "PRAGMA journal_mode = OFF"
              )
          
              connection.execute(
                  "PRAGMA synchronous = OFF"
              )
          
              connection.execute(
                  "PRAGMA temp_store = MEMORY"
              )
          
              connection.execute(
                  "PRAGMA cache_size = -250000"
              )
          
              # locking_mode=EXCLUSIVE عمداً استفاده نشده است.
          
              connection.execute("""
                  CREATE TABLE episodes (
                      tconst TEXT PRIMARY KEY,
                      title TEXT NOT NULL,
                      original_title TEXT,
                      is_adult INTEGER NOT NULL DEFAULT 0,
                      start_year INTEGER,
                      end_year INTEGER,
                      runtime INTEGER,
                      genres TEXT NOT NULL DEFAULT '[]',
          
                      parent_id TEXT,
                      season_number INTEGER,
                      episode_number INTEGER,
          
                      directors TEXT NOT NULL DEFAULT '[]',
                      writers TEXT NOT NULL DEFAULT '[]',
                      actors TEXT NOT NULL DEFAULT '[]'
                  ) WITHOUT ROWID
              """)
          
              connection.execute("""
                  CREATE TABLE names (
                      nconst TEXT PRIMARY KEY,
                      primary_name TEXT NOT NULL
                  ) WITHOUT ROWID
              """)
          
              # ایندکس روی parent_id چون حالا shardبندی و مرتب‌سازی اصلی بر اساس سریال انجام می‌شود
              connection.execute("""
                  CREATE INDEX idx_episodes_parent
                  ON episodes (parent_id, tconst)
              """)
          
              return connection
          
          
          def load_episodes(connection):
              print(
                  "Loading tvEpisode rows from "
                  "title.basics..."
              )
          
              handle, reader = open_dataset(
                  "title.basics.tsv.gz"
              )
          
              sql = """
                  INSERT OR REPLACE INTO episodes (
                      tconst,
                      title,
                      original_title,
                      is_adult,
                      start_year,
                      end_year,
                      runtime,
                      genres
                  )
                  VALUES (?, ?, ?, ?, ?, ?, ?, ?)
              """
          
              batch = []
              count = 0
          
              try:
                  for row in reader:
                      if row.get("titleType") != "tvEpisode":
                          continue
          
                      title_id = row["tconst"]
          
                      batch.append((
                          title_id,
                          clean_text(
                              row.get("primaryTitle")
                          ) or title_id,
                          clean_text(
                              row.get("originalTitle")
                          ),
                          1 if row.get("isAdult") == "1" else 0,
                          clean_int(row.get("startYear")),
                          clean_int(row.get("endYear")),
                          clean_int(
                              row.get("runtimeMinutes")
                          ),
                          encode_json(
                              parse_genres(
                                  row.get("genres")
                              )
                          )
                      ))
          
                      if len(batch) >= DATABASE_BATCH_SIZE:
                          connection.executemany(sql, batch)
                          count += len(batch)
                          batch.clear()
          
                          if count % 250_000 == 0:
                              print(
                                  f"  Episodes loaded: "
                                  f"{count:,}"
                              )
          
                  if batch:
                      connection.executemany(sql, batch)
                      count += len(batch)
          
                  connection.commit()
          
              finally:
                  handle.close()
          
              print(f"Loaded {count:,} episodes.")
          
              return count
          
          
          def load_episode_relations(connection):
              print(
                  "Loading parent, season and "
                  "episode numbers..."
              )
          
              handle, reader = open_dataset(
                  "title.episode.tsv.gz"
              )
          
              sql = """
                  UPDATE episodes
                  SET
                      parent_id = ?,
                      season_number = ?,
                      episode_number = ?
                  WHERE tconst = ?
              """
          
              batch = []
              count = 0
          
              try:
                  for row in reader:
                      batch.append((
                          clean_text(
                              row.get("parentTconst")
                          ),
                          clean_int(
                              row.get("seasonNumber")
                          ),
                          clean_int(
                              row.get("episodeNumber")
                          ),
                          row["tconst"]
                      ))
          
                      if len(batch) >= DATABASE_BATCH_SIZE:
                          connection.executemany(sql, batch)
                          count += len(batch)
                          batch.clear()
          
                          if count % 250_000 == 0:
                              print(
                                  "  Episode relations "
                                  f"processed: {count:,}"
                              )
          
                  if batch:
                      connection.executemany(sql, batch)
                      count += len(batch)
          
                  connection.commit()
          
              finally:
                  handle.close()
          
              print(
                  f"Processed {count:,} "
                  "episode relation rows."
              )
          
          
          def load_crew(connection):
              print(
                  "Loading episode directors "
                  "and writers..."
              )
          
              handle, reader = open_dataset(
                  "title.crew.tsv.gz"
              )
          
              sql = """
                  UPDATE episodes
                  SET
                      directors = ?,
                      writers = ?
                  WHERE tconst = ?
              """
          
              batch = []
              count = 0
          
              try:
                  for row in reader:
                      batch.append((
                          encode_json(
                              parse_ids(
                                  row.get("directors")
                              )
                          ),
                          encode_json(
                              parse_ids(
                                  row.get("writers")
                              )
                          ),
                          row["tconst"]
                      ))
          
                      if len(batch) >= DATABASE_BATCH_SIZE:
                          connection.executemany(sql, batch)
                          count += len(batch)
                          batch.clear()
          
                          if count % 500_000 == 0:
                              print(
                                  f"  Crew rows processed: "
                                  f"{count:,}"
                              )
          
                  if batch:
                      connection.executemany(sql, batch)
                      count += len(batch)
          
                  connection.commit()
          
              finally:
                  handle.close()
          
              print(
                  f"Processed {count:,} crew rows."
              )
          
          
          def load_cast(connection):
              print(
                  f"Loading top {CAST_LIMIT} cast "
                  "members for each episode..."
              )
          
              handle, reader = open_dataset(
                  "title.principals.tsv.gz"
              )
          
              sql = """
                  UPDATE episodes
                  SET actors = ?
                  WHERE tconst = ?
              """
          
              current_title_id = None
              current_cast = []
          
              update_batch = []
              title_count = 0
          
              def save_current_title():
                  nonlocal title_count
          
                  if current_title_id is None:
                      return
          
                  selected_cast = sorted(
                      current_cast,
                      key=lambda item: item[0]
                  )[:CAST_LIMIT]
          
                  actor_ids = [
                      person_id
                      for _, person_id in selected_cast
                  ]
          
                  update_batch.append((
                      encode_json(actor_ids),
                      current_title_id
                  ))
          
                  title_count += 1
          
                  if len(update_batch) >= DATABASE_BATCH_SIZE:
                      connection.executemany(
                          sql,
                          update_batch
                      )
          
                      update_batch.clear()
          
                      if title_count % 250_000 == 0:
                          print(
                              "  Principal titles "
                              f"processed: {title_count:,}"
                          )
          
              try:
                  for row in reader:
                      title_id = row["tconst"]
          
                      if current_title_id is None:
                          current_title_id = title_id
          
                      elif title_id != current_title_id:
                          save_current_title()
          
                          current_title_id = title_id
                          current_cast = []
          
                      category = row.get("category")
          
                      if category not in (
                          "actor",
                          "actress",
                          "self"
                      ):
                          continue
          
                      if len(current_cast) >= CAST_LIMIT:
                          continue
          
                      person_id = clean_text(
                          row.get("nconst")
                      )
          
                      if person_id is None:
                          continue
          
                      ordering = clean_int(
                          row.get("ordering")
                      )
          
                      if ordering is None:
                          ordering = 999999
          
                      current_cast.append((
                          ordering,
                          person_id
                      ))
          
                  save_current_title()
          
                  if update_batch:
                      connection.executemany(
                          sql,
                          update_batch
                      )
          
                  connection.commit()
          
              finally:
                  handle.close()
          
              print(
                  "Processed principals for "
                  f"{title_count:,} titles."
              )
          
          
          def load_names(connection):
              print("Loading IMDb person names...")
          
              handle, reader = open_dataset(
                  "name.basics.tsv.gz"
              )
          
              sql = """
                  INSERT OR REPLACE INTO names (
                      nconst,
                      primary_name
                  )
                  VALUES (?, ?)
              """
          
              batch = []
              count = 0
          
              try:
                  for row in reader:
                      person_id = clean_text(
                          row.get("nconst")
                      )
          
                      if person_id is None:
                          continue
          
                      person_name = clean_text(
                          row.get("primaryName")
                      ) or person_id
          
                      batch.append((
                          person_id,
                          person_name
                      ))
          
                      if len(batch) >= DATABASE_BATCH_SIZE:
                          connection.executemany(
                              sql,
                              batch
                          )
          
                          count += len(batch)
                          batch.clear()
          
                          if count % 500_000 == 0:
                              print(
                                  f"  Names loaded: "
                                  f"{count:,}"
                              )
          
                  if batch:
                      connection.executemany(
                          sql,
                          batch
                      )
          
                      count += len(batch)
          
                  connection.commit()
          
              finally:
                  handle.close()
          
              print(f"Loaded {count:,} names.")
          
          
          def get_series_shard_path(series_id):
              # tt1234567 -> episodes/12/tt1234567.json
              # shardبندی حالا بر اساس آیدی سریال (parentId) است، نه آیدی خودِ اپیزود،
              # تا همه‌ی اپیزودهای یک سریال همیشه در یک فایل واحد قرار بگیرند.
              shard_prefix = series_id[2:4].ljust(2, "0")
          
              directory = (
                  EPISODE_DIRECTORY /
                  shard_prefix
              )
          
              directory.mkdir(
                  parents=True,
                  exist_ok=True
              )
          
              return directory / f"{series_id}.json"
          
          
          def load_people_names(connection, person_ids):
              unique_ids = list(set(person_ids))
              names = {}
          
              for start in range(
                  0,
                  len(unique_ids),
                  NAME_QUERY_BATCH_SIZE
              ):
                  batch = unique_ids[
                      start:
                      start + NAME_QUERY_BATCH_SIZE
                  ]
          
                  if not batch:
                      continue
          
                  placeholders = ",".join(
                      "?"
                      for _ in batch
                  )
          
                  query = f"""
                      SELECT nconst, primary_name
                      FROM names
                      WHERE nconst IN ({placeholders})
                  """
          
                  for person_id, person_name in (
                      connection.execute(query, batch)
                  ):
                      names[person_id] = person_name
          
              return names
          
          
          def write_shard(
              connection,
              series_id,
              rows
          ):
              if not rows:
                  return 0
          
              all_person_ids = []
          
              parsed_rows = []
          
              for row in rows:
                  (
                      title_id,
                      title,
                      original_title,
                      is_adult,
                      start_year,
                      end_year,
                      runtime,
                      genres_json,
                      parent_id,
                      season_number,
                      episode_number,
                      directors_json,
                      writers_json,
                      actors_json
                  ) = row
          
                  directors = json.loads(
                      directors_json or "[]"
                  )
          
                  writers = json.loads(
                      writers_json or "[]"
                  )
          
                  actors = json.loads(
                      actors_json or "[]"
                  )[:CAST_LIMIT]
          
                  all_person_ids.extend(directors)
                  all_person_ids.extend(writers)
                  all_person_ids.extend(actors)
          
                  parsed_rows.append((
                      title_id,
                      title,
                      original_title,
                      is_adult,
                      start_year,
                      end_year,
                      runtime,
                      json.loads(genres_json or "[]"),
                      parent_id,
                      season_number,
                      episode_number,
                      directors,
                      writers,
                      actors
                  ))
          
              people_names = load_people_names(
                  connection,
                  all_person_ids
              )
          
              def make_people(person_ids):
                  return [
                      {
                          "id": person_id,
                          "name": people_names.get(
                              person_id,
                              person_id
                          )
                      }
                      for person_id in person_ids
                  ]
          
              output = {}
          
              for row in parsed_rows:
                  (
                      title_id,
                      title,
                      original_title,
                      is_adult,
                      start_year,
                      end_year,
                      runtime,
                      genres,
                      parent_id,
                      season_number,
                      episode_number,
                      directors,
                      writers,
                      actors
                  ) = row
          
                  output[title_id] = {
                      "id": title_id,
                      "title": title,
                      "originalTitle": original_title,
                      "type": "tvEpisode",
                      "adult": bool(is_adult),
                      "startYear": start_year,
                      "endYear": end_year,
                      "runtime": runtime,
                      "genres": genres,
                      "parentId": parent_id,
                      "seasonNumber": season_number,
                      "episodeNumber": episode_number,
                      "directors": make_people(
                          directors
                      ),
                      "writers": make_people(
                          writers
                      ),
                      "actors": make_people(
                          actors
                      )
                  }
          
              output_path = get_series_shard_path(series_id)
          
              temporary_path = output_path.with_suffix(
                  ".json.tmp"
              )
          
              with temporary_path.open(
                  "w",
                  encoding="utf-8"
              ) as output_file:
                  json.dump(
                      output,
                      output_file,
                      ensure_ascii=False,
                      separators=(",", ":")
                  )
          
              temporary_path.replace(output_path)
          
              return len(output)
          
          
          def write_episode_shards(connection):
              print(
                  "Writing episode shard files "
                  "(grouped by series/parentId)..."
              )
          
              # فقط اپیزودهایی که parent_id دارند در نظر گرفته می‌شوند،
              # چون بدون parent_id هیچ‌وقت از مسیر /series هم قابل دسترسی نبودند.
              query = """
                  SELECT
                      tconst,
                      title,
                      original_title,
                      is_adult,
                      start_year,
                      end_year,
                      runtime,
                      genres,
                      parent_id,
                      season_number,
                      episode_number,
                      directors,
                      writers,
                      actors
                  FROM episodes
                  WHERE parent_id IS NOT NULL
                  ORDER BY parent_id, tconst
              """
          
              cursor = connection.execute(query)
          
              current_parent_id = None
              current_rows = []
          
              episode_count = 0
              series_count = 0
          
              for row in cursor:
                  parent_id = row[8]
          
                  if current_parent_id is None:
                      current_parent_id = parent_id
          
                  elif parent_id != current_parent_id:
                      written = write_shard(
                          connection,
                          current_parent_id,
                          current_rows
                      )
          
                      episode_count += written
                      series_count += 1
          
                      if series_count % 5_000 == 0:
                          print(
                              f"  Series written: "
                              f"{series_count:,}; "
                              f"episodes: "
                              f"{episode_count:,}"
                          )
          
                      current_parent_id = parent_id
                      current_rows = []
          
                  current_rows.append(row)
          
              if current_rows:
                  written = write_shard(
                      connection,
                      current_parent_id,
                      current_rows
                  )
          
                  episode_count += written
                  series_count += 1
          
              print(
                  f"Finished writing "
                  f"{episode_count:,} episodes "
                  f"into {series_count:,} series files."
              )
          
              return episode_count, series_count
          
          
          def write_version_file(
              episode_count,
              series_count
          ):
              version_data = {
                  "updated": datetime.datetime.now(
                      datetime.timezone.utc
                  ).isoformat(),
                  "episodes": episode_count,
                  "series": series_count,
                  "castLimit": CAST_LIMIT,
                  "formatVersion": 3,
                  "shardStrategy": "parentId",
                  "pathPattern": (
                      "episodes/{prefix}/"
                      "{seriesId}.json"
                  )
              }
          
              with (
                  OUTPUT_DIRECTORY /
                  "version.json"
              ).open(
                  "w",
                  encoding="utf-8"
              ) as output_file:
                  json.dump(
                      version_data,
                      output_file,
                      ensure_ascii=False,
                      separators=(",", ":")
                  )
          
          
          def main():
              reset_build()
          
              connection = create_database()
          
              try:
                  expected_episode_count = load_episodes(
                      connection
                  )
          
                  load_episode_relations(connection)
                  load_crew(connection)
                  load_cast(connection)
                  load_names(connection)
          
                  episode_count, series_count = (
                      write_episode_shards(connection)
                  )
          
                  skipped_count = (
                      expected_episode_count - episode_count
                  )
          
                  if skipped_count > 0:
                      print(
                          f"Skipped {skipped_count:,} episodes "
                          "without a parent series (these were "
                          "never reachable via /series anyway)."
                      )
          
                  if skipped_count < 0:
                      raise RuntimeError(
                          "Episode count mismatch: "
                          f"database={expected_episode_count:,}, "
                          f"output={episode_count:,}"
                      )
          
                  write_version_file(
                      episode_count,
                      series_count
                  )
          
              finally:
                  connection.close()
          
              print("Build completed successfully.")
              print(
                  f"Episodes: {episode_count:,}"
              )
              print(
                  f"Series files: {series_count:,}"
              )
              print(
                  f"Cast limit: {CAST_LIMIT}"
              )
          
          
          if __name__ == "__main__":
              main()
            

          PY

      - name: Show output information
        shell: bash
        run: |
          set -euo pipefail

          echo "Version information:"
          cat out/version.json
          echo

          echo "Output size:"
          du -sh out

          echo "Number of shard files:"
          find out/episodes -type f -name '*.json' | wc -l

          echo "Example shard files:"
          find out/episodes -type f -name '*.json' | head -n 10 || true

          echo "Disk information:"
          df -h

      - name: Remove temporary build files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf datasets
          rm -f episodes-build.sqlite3
          rm -f episodes-build.sqlite3-shm
          rm -f episodes-build.sqlite3-wal
          rm -f episodes-build.sqlite3-journal

          df -h

      - name: Deploy episodes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "IMDb Episodes Bot"
          git config user.email "bot@users.noreply.github.com"

          git checkout --orphan gh-pages

          git rm -rf . || true

          mv out/episodes ./episodes
          mv out/version.json ./version.json

          rm -rf out

          touch .nojekyll

          git add episodes version.json .nojekyll

          git commit \
            -m "Update IMDb episode shards"

          git push \
            --force \
            origin gh-pages
